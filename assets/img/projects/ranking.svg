<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="#edf0e9"/><g font-family="Arial, sans-serif" fill="#192c32"><title>Conceptual conversation and ranking loop</title><text x="40" y="43" font-size="11" fill="#246d65" letter-spacing="2">CONVERSATIONAL RANKING</text><rect x="40" y="90" width="230" height="118" rx="4" fill="#f8f7f3" stroke="#b7c9bd"/><text x="60" y="120" font-size="19" fill="#192c32" >Express a preference</text><text x="60" y="151" font-size="16" fill="#596665" >“What if we prioritize</text><text x="60" y="176" font-size="16" fill="#596665" >a different criterion?”</text><path d="M270 149 L338 149" stroke="#719489" stroke-width="1.5" fill="none"/><text x="304" y="138" font-size="26" fill="#246d65" >→</text><rect x="350" y="90" width="245" height="174" rx="4" fill="#f8f7f3" stroke="#b7c9bd"/><text x="372" y="120" font-size="19" fill="#192c32" >Inspect the ranking</text><text x="373" y="161" font-size="13" fill="#596665" >A</text><rect x="400" y="149" width="145" height="15" rx="2" fill="#246d65" opacity="1.0"/><text x="373" y="193" font-size="13" fill="#596665" >B</text><rect x="400" y="181" width="112" height="15" rx="2" fill="#246d65" opacity="0.78"/><text x="373" y="225" font-size="13" fill="#596665" >C</text><rect x="400" y="213" width="76" height="15" rx="2" fill="#246d65" opacity="0.56"/><path d="M472 272 V294 H155 V220" stroke="#719489" stroke-width="1.5" fill="none"/><text x="222" y="285" font-size="13" fill="#596665" >Reflect and refine</text><text x="40" y="331" font-size="11" fill="#596665" >Conceptual interaction · not a system screenshot</text></g></svg>
